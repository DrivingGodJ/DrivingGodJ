<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">附中影像</title><desc id="desc">把校园照片，放回拍摄的地方。</desc>
