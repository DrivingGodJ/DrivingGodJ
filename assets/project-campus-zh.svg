<style>text{font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif}</style><rect width="960" height="540" fill="url(#glow)"/><rect x="1" y="1" width="958" height="538" fill="url(#dots)" stroke="var(--border)"/>
